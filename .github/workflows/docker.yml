name: Build and test Docker image

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t aast-react-hello .
      - name: Smoke test the server
        run: |
          docker run -d -p 8080:80 --name hello aast-react-hello
          trap 'docker logs hello; docker rm -f hello' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://localhost:8080/ -o /tmp/index.html
          grep -q '<div id="root"></div>' /tmp/index.html
          docker exec hello sh -c 'grep -rq "Hello World!!!" /usr/share/nginx/html/assets'
